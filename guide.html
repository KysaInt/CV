<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AYE · 作品概览</title>
    <style>
        :root {
            --ink: #f4f0e9;
            --quiet: rgba(244, 240, 233, 0.66);
            --night: #252827;
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            color: var(--ink);
            background: var(--night);
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        body::before,
        body::after {
            position: fixed;
            inset: -25%;
            z-index: -2;
            content: "";
            pointer-events: none;
            filter: blur(80px);
            opacity: 0.74;
        }

        body::before {
            background: radial-gradient(circle at 12% 22%, #81564d, transparent 31%),
                radial-gradient(circle at 82% 72%, #2d5d5a, transparent 38%);
            animation: atmosphere 26s ease-in-out infinite alternate;
        }

        body::after {
            background: radial-gradient(circle at 73% 18%, #62674c, transparent 34%),
                radial-gradient(circle at 28% 84%, #333536, transparent 37%);
            animation: atmosphere 34s ease-in-out infinite alternate-reverse;
        }

        @keyframes atmosphere {
            from { transform: translate3d(-3%, -2%, 0) scale(1); }
            to { transform: translate3d(4%, 3%, 0) scale(1.09); }
        }

        .scene {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            isolation: isolate;
        }

        .scene::after {
            position: absolute;
            inset: 0;
            z-index: 2;
            content: "";
            pointer-events: none;
            background: linear-gradient(115deg, rgba(14, 16, 16, 0.42), transparent 42%, rgba(14, 16, 16, 0.18));
        }

        .tile-layer {
            position: absolute;
            top: -100vh;
            left: -100vw;
            width: 320vw;
            height: 320vh;
            z-index: 1;
            transform: rotate(-45deg);
            transform-origin: center center;
            animation: track-roll var(--roll-duration) linear infinite;
            will-change: transform;
            --roll-duration: 42s;
        }

        @keyframes track-roll {
            from { transform: rotate(-45deg) translate3d(-12vw, 0, 0); }
            to { transform: rotate(-45deg) translate3d(42vw, 0, 0); }
        }

        .tile {
            position: absolute;
            width: var(--card-width);
            height: var(--card-height);
            padding: 0;
            border: 0;
            border-radius: 7px;
            overflow: hidden;
            cursor: pointer;
            opacity: 0;
            background: #202321 var(--image) center / cover no-repeat;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.22);
            animation: independent-fade var(--fade-duration) ease-in-out var(--fade-delay) forwards;
            transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.4s ease, outline-color 0.35s ease;
            filter: blur(0) brightness(1) saturate(1);
            transition-property: transform, box-shadow, outline-color, filter;
            will-change: opacity, transform, filter;
        }

        .tile.initial-visible {
            opacity: 0.94;
            animation: none;
        }

        .tile:hover,
        .tile:focus-visible,
        .tile.is-hovered {
            z-index: 10;
            outline: 2px solid rgba(255, 255, 255, 0.9);
            outline-offset: 4px;
            animation-play-state: paused;
            transform: rotate(45deg) scale(2.4) !important;
            box-shadow: 0 22px 46px rgba(0, 0, 0, 0.46);
        }

        .tile.is-video::after {
            position: absolute;
            top: 50%;
            left: 50%;
            display: grid;
            width: 46px;
            height: 46px;
            place-items: center;
            content: "▶";
            color: #202321;
            font-size: 20px;
            line-height: 1;
            background: rgba(244, 240, 233, 0.9);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 5px 16px rgba(0, 0, 0, 0.35);
            pointer-events: none;
        }

        @keyframes independent-fade {
            0%, 3% { opacity: 0; }
            10%, 93% { opacity: 0.94; }
            98%, 100% { opacity: 0; }
        }

        .intro {
            position: absolute;
            z-index: 5;
            pointer-events: none;
            text-shadow: 0 10px 28px rgba(0, 0, 0, 0.38);
        }

        .intro {
            top: 28px;
            left: 30px;
            z-index: 30;
            max-width: 620px;
            padding: 14px 20px 20px 12px;
            background: linear-gradient(110deg, rgba(28, 30, 29, 0.96), rgba(28, 30, 29, 0.72) 72%, transparent);
            border-radius: 0 0 26px 0;
        }
        .eyebrow {
            color: var(--quiet);
            font-size: 10px;
            letter-spacing: 0.28em;
            text-transform: uppercase;
        }
        .eyebrow { margin-bottom: 15px; }
        h1 {
            max-width: 590px;
            margin: 0;
            font-size: clamp(2.7rem, 6.2vw, 6.8rem);
            line-height: 0.93;
            letter-spacing: -0.075em;
        }
        .hover-info {
            position: fixed;
            right: 30px;
            bottom: 30px;
            left: auto;
            z-index: 40;
            width: min(620px, calc(100vw - 60px));
            padding: 14px 20px 17px 12px;
            color: var(--ink);
            background: linear-gradient(250deg, rgba(28, 30, 29, 0.96), rgba(28, 30, 29, 0.72) 72%, transparent);
            border: 0;
            border-radius: 26px 0 0 0;
            box-shadow: 0 -12px 30px rgba(0, 0, 0, 0.18);
            opacity: 0;
            pointer-events: none;
            transform: translateY(12px);
            transition: opacity 0.38s ease, transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .hover-info.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .hover-role {
            margin-bottom: 3px;
            font-size: clamp(18px, 2.2vw, 28px);
            font-weight: 700;
        }

        .hover-company,
        .hover-time,
        .hover-tools {
            color: var(--quiet);
            font-size: 13px;
            letter-spacing: 0.05em;
        }

        .hover-tools { margin-top: 4px; }

        .hover-summary {
            margin: 8px 0 0;
            color: rgba(244, 240, 233, 0.84);
            font-size: 15px;
            line-height: 1.65;
        }

        @media (max-width: 720px) {
            .intro { top: 24px; left: 22px; max-width: 78vw; }
            h1 { font-size: clamp(2.5rem, 13vw, 4.7rem); }
            .tile:hover,
            .tile:focus-visible,
            .tile.is-hovered { transform: rotate(-45deg) scale(1.8) !important; }
            .hover-info { right: 22px; bottom: 18px; left: 22px; width: auto; padding: 12px 16px 14px 12px; }
            .hover-summary { font-size: 12px; }
        }

        @media (prefers-reduced-motion: reduce) {
            body::before, body::after { animation: none; }
            .tile { animation-duration: 0.01ms, 0.01ms; animation-iteration-count: 1, 1; opacity: 0.82; transform: none; }
        }
    </style>
</head>

        function assetWeight(asset) {
            if (asset.kind === 'video') return 2;
            if (asset.source === 'MLMW') return 5;
            if (['DHZS', 'ENS', 'ZX', 'BSBP'].includes(asset.source)) return 0.05;
            return 1;
        }

        function weightedTake(pool) {
            if (!pool.length) return null;
            const totalWeight = pool.reduce((sum, asset) => sum + assetWeight(asset), 0);
            let threshold = Math.random() * totalWeight;
            const selectedIndex = pool.findIndex((asset) => {
                threshold -= assetWeight(asset);
                return threshold <= 0;
            });
            return pool.splice(selectedIndex === -1 ? pool.length - 1 : selectedIndex, 1)[0];
        }

        function loadAsset(asset) {
            return new Promise((resolve) => {
                const image = new Image();
                image.onload = () => resolve(asset);
                image.onerror = () => resolve(null);
                image.src = asset.thumb;
            });
        }

        async function loadVideoAsset(video) {
            const image = await loadAsset(video);
            if (image) return { ...video, kind: 'video' };
            return { ...video, kind: 'video', thumb: video.fallback };
        }

        function nextAsset(activeTitles = []) {
            const active = new Set(activeTitles);
            const candidates = validAssets.filter((asset) => !active.has(asset.name));
            if (!candidates.length) return validAssets[0];

            return weightedTake([...candidates]);
        }

        function nextVideo(activeTitles = []) {
            const active = new Set(activeTitles);
            const candidates = videoAssets.filter((asset) => !active.has(asset.name));
            return candidates[Math.floor(Math.random() * candidates.length)] || videoAssets[0];
        }

        function nextImage(activeTitles = []) {
            const active = new Set(activeTitles);
            const candidates = imageAssets.filter((asset) => !active.has(asset.name));
            return candidates.length ? candidates[Math.floor(Math.random() * candidates.length)] : imageAssets[0];
        }

        function showExperience(tile, asset) {
            const experience = experienceByPage[asset.page] || experienceBySource[asset.source] || experienceBySource.OTHER;
            hoverRole.textContent = experience[0];
            hoverCompany.textContent = experience[1];
            hoverTime.textContent = experience[2];
            hoverTools.textContent = '工具：' + experience[3];
            hoverSummary.textContent = experience[4];
            tile.classList.add('is-hovered');
            hoverInfo.classList.add('visible');
        }

        function hideExperience(tile) {
            tile.classList.remove('is-hovered');
            hoverInfo.classList.remove('visible');
        }

        function mount(asset, index, total) {
            createTile(asset, index, total, false);
        }

        function createTile(asset, index, total, isInitial = false) {
            const tile = document.createElement('button');
            const cardWidth = 128 + Math.random() * 6;
            const cardHeight = 128 + Math.random() * 6;
            const sourcePage = asset.page || pageBySource[asset.source] || 'index.html';
            tile.type = 'button';
            tile.className = asset.kind === 'video' ? 'tile is-video' : 'tile';
            if (isInitial) tile.classList.add('initial-visible');
            tile.dataset.title = asset.name;
            tile.setAttribute('aria-label', asset.name + '，点击进入作品页面');
            const slot = index % visibleLimit;
            const column = slot % 30;
            const row = Math.floor(slot / 30);
            const columnStep = Math.max(cardWidth + 34, 166);
            const rowStep = Math.max(cardHeight + 34, 166);
            const layerWidth = window.innerWidth * 3.2;
            const layerHeight = window.innerHeight * 3.2;
            const gridWidth = 30 * columnStep;
            const gridHeight = 30 * rowStep;
            const left = (layerWidth - gridWidth) / 2 + column * columnStep;
            const top = (layerHeight - gridHeight) / 2 + row * rowStep;
            tile.style.left = left.toFixed(1) + 'px';
            tile.style.top = top.toFixed(1) + 'px';
            tile.style.setProperty('--card-width', cardWidth.toFixed(1) + 'px');
            tile.style.setProperty('--card-height', cardHeight.toFixed(1) + 'px');
            tile.style.setProperty('--image', 'url("' + asset.thumb + '")');
            const fadeDuration = 10 + Math.random() * 2;
            const fadeDelay = Math.random() * 0.8;
            tile.style.setProperty('--fade-duration', fadeDuration.toFixed(2) + 's');
            tile.style.setProperty('--fade-delay', fadeDelay.toFixed(2) + 's');
            if (isInitial) {
                window.setTimeout(() => {
                    tile.style.animationDelay = '-2.4s';
                    tile.classList.remove('initial-visible');
                }, 1200);
            }
            tile.addEventListener('mouseenter', () => {
                tile.dataset.hovered = 'true';
                showExperience(tile, asset);
            });
            tile.addEventListener('mouseleave', () => {
                tile.dataset.hovered = 'false';
                hideExperience(tile);
            });
            tile.addEventListener('focus', () => {
                tile.dataset.hovered = 'true';
                showExperience(tile, asset);
            });
            tile.addEventListener('blur', () => {
                tile.dataset.hovered = 'false';
                hideExperience(tile);
            });
            tile.addEventListener('click', () => {
                const focusKey = asset.bvid || asset.name;
                window.location.href = sourcePage + '?focus=' + encodeURIComponent(focusKey);
            });
            layer.appendChild(tile);
            window.setTimeout(() => {
                if (tile.dataset.hovered === 'true') {
                    window.setTimeout(() => tile.dispatchEvent(new Event('lifecycle')), 500);
                    return;
                }
                const activeTitles = [...layer.children]
                    .filter((node) => node !== tile)
                    .map((node) => node.dataset.title);
                tile.remove();
                mount(nextAsset(activeTitles), index, total);
            }, (fadeDelay + fadeDuration) * 1000);
            tile.addEventListener('lifecycle', () => {
                if (tile.dataset.hovered === 'true') {
                    window.setTimeout(() => tile.dispatchEvent(new Event('lifecycle')), 500);
                    return;
                }
                const activeTitles = [...layer.children]
                    .filter((node) => node !== tile)
                    .map((node) => node.dataset.title);
                tile.remove();
                mount(nextAsset(activeTitles), index, total);
            });
        }

        const videoCandidates = window.GUIDE_VIDEOS || fallbackVideoCandidates;

        Promise.all([
            ...assetCandidates.map(loadAsset),
            ...videoCandidates.map(loadVideoAsset)
        ]).then((loaded) => {
            validAssets = loaded.filter(Boolean);
            const initialPool = [...validAssets];
            for (let index = 0; index < Math.min(visibleLimit, initialPool.length); index += 1) {
                createTile(weightedTake(initialPool), index, validAssets.length, true);
            }
        });
    </script>
</body>
</html>
