<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上海木里木外时期作品</title>
    <link rel="stylesheet" href="assets/css/work-common.css">
    <link rel="stylesheet" href="assets/css/gallery-common.css">
    <link rel="stylesheet" href="assets/css/lightbox-common.css">
    <style>
        h1, h3 { color: #fff; }
        h1:first-of-type {
            margin-top: 0;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #00f;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body data-lightbox-selector=".gallery img">
    <div class="top-spacer"></div>
    <div id="sticky-title" class="sticky-title">
        <span class="sticky-title-text">上海木里木外时期作品</span>
        <a class="sticky-back" href="index.html">返回简历</a>
    </div>
    <div class="container">
        <h1 class="slide-animate">上海木里木外时期作品</h1>
        <p class="slide-animate">
            本页面展示了展厅及家具类产品的建模与渲染作品. 这些作品主要使用 3ds Max, vray 等工具完成, 旨在呈现高质量的视觉效果和设计细节.
        </p>

        <h3 class="slide-animate">作品展示</h3>
        <div class="gallery" id="gallery-main">
            <!-- image1~image28 动态加载 -->
        </div>

        <h3 class="slide-animate">门系列</h3>
        <div class="gallery" id="gallery-doors">
            <!-- m0~m14 动态加载 -->
        </div>

        <h3 class="slide-animate">细节类</h3>
        <div class="gallery" id="gallery-details">
            <!-- m15 及以后动态加载 -->
        </div>

        
    </div>

    <div id="fullscreen-overlay" style="display: none;" class="overlay">
        <img id="fullscreen-image" src="" alt="全屏展示">
    </div>

    <script>
        const mainGallery = document.getElementById('gallery-main');
        const doorsGallery = document.getElementById('gallery-doors');
        const detailsGallery = document.getElementById('gallery-details');

        const imageTotal = 28;
        const mTotal = 102;
        const imagePath = 'works/MLMW/';

        for (let i = 1; i <= imageTotal; i++) {
            const galleryItem = document.createElement('div');
            galleryItem.className = 'gallery-item slide-animate';

            const img = document.createElement('img');
            const fn = `image${i}.webp`;
            img.src = `${imagePath}thumbs/640/${fn}`;
            img.srcset = `${imagePath}thumbs/320/${fn} 320w, ${imagePath}thumbs/640/${fn} 640w, ${imagePath}thumbs/1280/${fn} 1280w`;
            img.sizes = '100vw';
            img.loading = 'lazy';
            img.dataset.fullsrc = `${imagePath}${fn}`;
            img.alt = `作品 ${i}`;

            galleryItem.appendChild(img);
            mainGallery.appendChild(galleryItem);
        }

        for (let i = 0; i <= 14; i++) {
            const galleryItem = document.createElement('div');
            galleryItem.className = 'gallery-item slide-animate';

            const img = document.createElement('img');
            const fn = `m${i}.webp`;
            img.src = `${imagePath}thumbs/640/${fn}`;
            img.srcset = `${imagePath}thumbs/320/${fn} 320w, ${imagePath}thumbs/640/${fn} 640w, ${imagePath}thumbs/1280/${fn} 1280w`;
            img.sizes = '100vw';
            img.loading = 'lazy';
            img.dataset.fullsrc = `${imagePath}${fn}`;
            img.alt = `门系列 ${i}`;

            galleryItem.appendChild(img);
            doorsGallery.appendChild(galleryItem);
        }

        for (let i = 15; i <= mTotal; i++) {
            const galleryItem = document.createElement('div');
            galleryItem.className = 'gallery-item slide-animate';

            const img = document.createElement('img');
            const fn = `m${i}.webp`;
            img.src = `${imagePath}thumbs/640/${fn}`;
            img.srcset = `${imagePath}thumbs/320/${fn} 320w, ${imagePath}thumbs/640/${fn} 640w, ${imagePath}thumbs/1280/${fn} 1280w`;
            img.sizes = '100vw';
            img.loading = 'lazy';
            img.dataset.fullsrc = `${imagePath}${fn}`;
            img.alt = `细节 ${i}`;

            galleryItem.appendChild(img);
            detailsGallery.appendChild(galleryItem);
        }

    </script>
    <script src="assets/js/image-lightbox.js"></script>
    <script src="assets/js/sticky-title.js"></script>
    <script src="assets/js/scroll-animate.js"></script>
    <script src="assets/js/focus-work.js"></script>
</body>
</html>
