<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上海伍鼎景观时期作品</title>
    <link rel="stylesheet" href="assets/css/work-common.css">
    <link rel="stylesheet" href="assets/css/gallery-common.css">
    <link rel="stylesheet" href="assets/css/lightbox-common.css">
    <style>
        h1, h3 { color: #fff; }
        h1:first-of-type {
            margin-top: 0;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #00f;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body data-lightbox-selector=".gallery img">
    <div class="top-spacer"></div>
    <div id="sticky-title" class="sticky-title">
        <span class="sticky-title-text">上海伍鼎景观时期作品</span>
        <a class="sticky-back" href="index.html">返回简历</a>
    </div>
    <div class="container">
        <h1 class="slide-animate">上海伍鼎景观时期作品</h1>
        <p class="slide-animate">
            本页面展示了上海伍鼎景观公司时期作品, 主要是 Enscape 渲染, 也有提案阶段的模型, 以及部分参考图.
        </p>
        <h3 class="slide-animate">Enscape 渲染</h3>
        <div class="gallery" id="gallery">
            <!-- 图片将通过 JavaScript 动态加载 -->
        </div>
        <h3 class="slide-animate">提案阶段杂项</h3>
        <div class="gallery" id="proposal-gallery">
            <!-- 图片将通过 JavaScript 动态加载 -->
        </div>
        <h3 class="slide-animate">标识标牌</h3>
        <div class="gallery" id="signage-gallery">
            <!-- 图片将通过 JavaScript 动态加载 -->
        </div>
        
    </div>
    <div id="fullscreen-overlay" style="display: none;" class="overlay">
        <img id="fullscreen-image" src="" alt="全屏展示">
    </div>
    <script>
        // 加载 ENSCAPE 渲染图片
        const totalImages = 416;
        const imagePath = 'works/SHWD/ENS/';
        const gallery = document.getElementById('gallery');
        for (let i = 1; i <= totalImages; i++) {
            const galleryItem = document.createElement('div');
            galleryItem.className = 'gallery-item slide-animate';

            const imgElement = document.createElement('img');
            const fn = `ens${i}.webp`;
            imgElement.src = `${imagePath}thumbs/640/${fn}`;
            imgElement.srcset = `${imagePath}thumbs/320/${fn} 320w, ${imagePath}thumbs/640/${fn} 640w, ${imagePath}thumbs/1280/${fn} 1280w`;
            imgElement.sizes = '100vw';
            imgElement.loading = 'lazy';
            imgElement.dataset.fullsrc = `${imagePath}${fn}`;
            imgElement.alt = `Enscape 渲染 ${i}`;

            galleryItem.appendChild(imgElement);
            gallery.appendChild(galleryItem);
        }

        // 加载提案阶段杂项图片
        const proposalTotalImages = 245;
        const proposalImagePath = 'works/SHWD/ZX/';
        const proposalGallery = document.getElementById('proposal-gallery');
        for (let i = 1; i <= proposalTotalImages; i++) {
            const galleryItem = document.createElement('div');
            galleryItem.className = 'gallery-item slide-animate';

            const imgElement = document.createElement('img');
            const fn = `zx${i}.webp`;
            imgElement.src = `${proposalImagePath}thumbs/640/${fn}`;
            imgElement.srcset = `${proposalImagePath}thumbs/320/${fn} 320w, ${proposalImagePath}thumbs/640/${fn} 640w, ${proposalImagePath}thumbs/1280/${fn} 1280w`;
            imgElement.sizes = '100vw';
            imgElement.loading = 'lazy';
            imgElement.dataset.fullsrc = `${proposalImagePath}${fn}`;
            imgElement.alt = `提案阶段杂项 ${i}`;

            galleryItem.appendChild(imgElement);
            proposalGallery.appendChild(galleryItem);
        }

        // 加载标识标牌图片
        const signageTotalImages = 442;
        const signageImagePath = 'works/SHWD/BSBP/';
        const signageGallery = document.getElementById('signage-gallery');
        for (let i = 1; i <= signageTotalImages; i++) {
            const galleryItem = document.createElement('div');
            galleryItem.className = 'gallery-item slide-animate';

            const imgElement = document.createElement('img');
            const fn = `bsbp${i}.webp`;
            imgElement.src = `${signageImagePath}thumbs/640/${fn}`;
            imgElement.srcset = `${signageImagePath}thumbs/320/${fn} 320w, ${signageImagePath}thumbs/640/${fn} 640w, ${signageImagePath}thumbs/1280/${fn} 1280w`;
            imgElement.sizes = '100vw';
            imgElement.loading = 'lazy';
            imgElement.dataset.fullsrc = `${signageImagePath}${fn}`;
            imgElement.alt = `标识标牌 ${i}`;

            galleryItem.appendChild(imgElement);
            signageGallery.appendChild(galleryItem);
        }

    </script>
    <script src="assets/js/image-lightbox.js"></script>
    <script src="assets/js/sticky-title.js"></script>
    <script src="assets/js/scroll-animate.js"></script>
    <script src="assets/js/focus-work.js"></script>
</body>
</html>
