<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香水瓶作品</title>
    <link rel="stylesheet" href="assets/css/work-common.css">
    <link rel="stylesheet" href="assets/css/gallery-common.css">
    <link rel="stylesheet" href="assets/css/lightbox-common.css">
    <style>
        .gallery-item img { cursor: zoom-in; }
        h1, h3 { color: #fff; }
        h1:first-of-type {
            margin-top: 0;
        }
        @media (max-width: 768px) {
            .gallery {
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            }
        }
        @media (max-width: 480px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body data-lightbox-selector=".gallery img" data-lightbox-clear="true">
    <div class="top-spacer"></div>
    <div id="sticky-title" class="sticky-title">
        <span class="sticky-title-text">香水瓶作品</span>
        <a class="sticky-back" href="index.html">返回简历</a>
    </div>

    <h1 class="slide-animate">香水瓶作品</h1>
    <p class="slide-animate">
        以下为香水瓶系列建模渲染作品, Rhino 建模, C4D + V-Ray 渲染, 整体历时 4 天. 后续利用渲染图片训练了对应风格的场景与玻璃焦散 LoRA, 主模型为 SDXL 1.0, 并通过 ComfyUI 输出一批 AI 生成图.
    </p>

    <div class="video-top slide-animate">
        <iframe src="//player.bilibili.com/player.html?isOutside=true&bvid=BV1KgGt6WEZb&p=1&autoplay=0&muted=0&danmaku=0" scrolling="no" frameborder="no" allowfullscreen="true"></iframe>
    </div>

    <h3 class="slide-animate">作品展示</h3>
    <div class="gallery slide-animate" id="gallery-main">
        <!-- XS0001~XS0035 动态加载 -->
    </div>

    <h3 class="slide-animate">ComfyUI LoRA 输出</h3>
    <p class="slide-animate">基于渲染图训练的场景与玻璃焦散 LoRA 模型, 主模型为 SDXL 1.0, 由 ComfyUI 生成.</p>
    <div class="gallery slide-animate" id="gallery-comfyui">
        <!-- COMFYUIOUTPUT 动态加载 -->
    </div>

    <div id="fullscreen-overlay" style="display: none;" class="overlay">
        <img id="fullscreen-image" src="" alt="全屏展示">
    </div>

    <script>
        const gallery = document.getElementById('gallery-main');
        const imagePath = 'works/20260522香水瓶/';
        const total = 35;

        for (let i = 1; i <= total; i++) {
            const fn = `XS${String(i).padStart(4, '0')}.webp`;
            const item = document.createElement('div');
            item.className = 'gallery-item slide-animate';

            const img = document.createElement('img');
            img.src = `${imagePath}thumbs/640/${fn}`;
            img.srcset = `${imagePath}thumbs/320/${fn} 320w, ${imagePath}thumbs/640/${fn} 640w, ${imagePath}thumbs/1280/${fn} 1280w`;
            img.sizes = '(max-width: 480px) 100vw, (max-width: 768px) 50vw, 33vw';
            img.loading = 'lazy';
            img.dataset.fullsrc = `${imagePath}${fn}`;
            img.alt = `香水瓶 ${i}`;

            item.appendChild(img);
            gallery.appendChild(item);
        }

        // ComfyUI 输出图加载 (8 张 PNG)
        const comfyGallery = document.getElementById('gallery-comfyui');
        const comfyImagePath = 'works/20260522香水瓶/COMFYUIOUTPUT/';
        const comfyImages = [
            'aye_bottle_00014_.png',
            'aye_bottle_00015_.png',
            'aye_bottle_00016_.png',
            'aye_bottle_00036_.png',
            'aye_bottle_00039_.png',
            'aye_bottle_00083_.png',
            'aye_bottle_00084_.png',
            'Flux.1_Dev_00003_.png',
        ];

        comfyImages.forEach((fn, i) => {
            const item = document.createElement('div');
            item.className = 'gallery-item slide-animate';

            const img = document.createElement('img');
            img.src = `${comfyImagePath}thumbs/640/${fn}`;
            img.srcset = `${comfyImagePath}thumbs/320/${fn} 320w, ${comfyImagePath}thumbs/640/${fn} 640w, ${comfyImagePath}thumbs/1280/${fn} 1280w`;
            img.sizes = '(max-width: 480px) 100vw, (max-width: 768px) 50vw, 33vw';
            img.loading = 'lazy';
            img.dataset.fullsrc = `${comfyImagePath}${fn}`;
            img.alt = `ComfyUI 输出 ${i + 1}`;

            item.appendChild(img);
            comfyGallery.appendChild(item);
        });

    </script>

    <script src="assets/js/image-lightbox.js"></script>
    <script src="assets/js/sticky-title.js"></script>
    <script src="assets/js/scroll-animate.js"></script>
    <script src="assets/js/focus-work.js"></script>
</body>
</html>
