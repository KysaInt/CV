<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEB3D 作品</title>
    <link rel="stylesheet" href="assets/css/work-common.css">
    <link rel="stylesheet" href="assets/css/video-common.css">
    <style>
        .gallery-item3 iframe {
            aspect-ratio: 1 / 1;
            width: 100%;
            border-radius: 8px;
            height: auto;
            display: block;
            border: none;
        }
        .gallery-item4 iframe, .gallery-item4 img {
            aspect-ratio: 344 / 144;
            width: 100%;
            border-radius: 8px;
            height: auto;
            display: block;
            border: none;
        }
        a { color: #ff9800; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="top-spacer"></div>
    <div id="sticky-title" class="sticky-title">
        <span class="sticky-title-text">WEB3D 作品</span>
        <a class="sticky-back" href="UE相关作品.html">返回</a>
    </div>

    <h1 class="slide-animate">WEB3D 作品</h1>

    <h3 class="slide-animate">Babylon.js 动画控制</h3>
    <div class="gallery-item slide-animate">
        <iframe src="https://kysaint.github.io/K/" scrolling="no" frameborder="0"></iframe>
    </div>
    <p class="slide-animate">
        使用 Babylon.js 和 Copilot AI 快速实现的动画效果, 相较于 UE 蓝图更高效.
    </p>

    <h3 class="slide-animate">鼠标模型与材质控制</h3>
    <div class="gallery-item3 slide-animate">
        <iframe class="mouse-model-iframe" src="https://kysaint.github.io/K3/" scrolling="no" frameborder="0"></iframe>
    </div>
    <p class="slide-animate">
        这是一个学习 Web3D 技术的项目, 结合 Babylon.js 实现了 PBR 材质调整功能, 展示了 Web3D 的灵活性.
    </p>
    <div class="gallery-item4 slide-animate">
        <iframe src="//player.bilibili.com/player.html?isOutside=true&aid=114332583073448&bvid=BV1Z1ogY3E1i&cid=29400632801&p=1" scrolling="no" border="0" frameborder="no" framespacing="0" allowfullscreen="true"></iframe>
    </div>
    <p class="slide-animate">
        制作过程记录.
    </p>
    <div class="gallery-item4 slide-animate">
        <img src="works/OTHER/thumbs/640/logitechx16.png" srcset="works/OTHER/thumbs/320/logitechx16.png 320w, works/OTHER/thumbs/640/logitechx16.png 640w, works/OTHER/thumbs/1280/logitechx16.png 1280w" sizes="100vw" loading="lazy" alt="Logitech G102 Pixel Art" style="width: 100%; border-radius: 8px; display: block;">
    </div>
    <p class="slide-animate">
        Pixel Art!
    </p>

    <script src="assets/js/sticky-title.js"></script>
    <script src="assets/js/scroll-animate.js"></script>
    <script src="assets/js/focus-work.js"></script>
</body>
</html>
