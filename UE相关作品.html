    <style>
        h1:first-of-type {
            margin-top: 0;
        }


        .gallery-item2 iframe {
            aspect-ratio: 1644 / 3840; /* 设置长宽比为 216:72 */
            width: 100%;
            border-radius: 8px; /* 统一圆角效果 */
            height: auto;
            display: block;
            border: none; /* 移除边框 */
        }

        .gallery-item3 iframe {
            aspect-ratio: 1/ 1; /* 设置长宽比为 216:72 */
            width: 100%;
            border-radius: 8px; /* 统一圆角效果 */
            height: auto;
            display: block;
            border: none; /* 移除边框 */
        }
        .gallery-item4 iframe {
            aspect-ratio: 344/ 144; /* 设置长宽比为 216:72 */
            width: 100%;
            border-radius: 8px; /* 统一圆角效果 */
            height: auto;
            display: block;
            border: none; /* 移除边框 */
        }
        a {
            color: #ff9800;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .back-link {
            margin-top: 20px;
            display: block;
            font-size: 0.9rem;
            color: #ff9800;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        /* 导航卡片 */
        .nav-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 10px;
            margin-bottom: 40px;
        }
        .nav-card {
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 12px;
            text-decoration: none;
            color: #ddd;
            transition: box-shadow 0.28s, transform 0.22s, border-color 0.28s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.35);
            cursor: pointer;
            min-height: 130px;
        }
        .nav-card:hover {
            box-shadow: 0 8px 28px rgba(0,0,0,0.5), 0 1px 6px rgba(255,152,0,0.18);
            transform: translateY(-3px) scale(1.015);
            border-color: rgba(255,152,0,0.35);
            text-decoration: none;
        }
        /* 视频背景层 */
        .card-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }
        .card-bg iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 220%;
            height: 220%;
            transform: translate(-50%, -50%);
            filter: blur(14px) brightness(0.55) saturate(1.3);
            border: none;
        }
        /* 深色遮罩，保持文字可读 */
        .card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(0,0,0,0.52) 0%, rgba(0,0,0,0.32) 100%);
            z-index: 1;
            transition: background 0.28s;
        }
        .nav-card:hover .card-overlay {
            background: linear-gradient(135deg, rgba(0,0,0,0.38) 0%, rgba(0,0,0,0.18) 100%);
        }
        /* 文字内容层 */
        .card-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: space-between;
            padding: 24px 24px 20px 24px;
            min-height: 130px;
        }
        .nav-card-title {
            font-size: 1.18rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 8px;
            text-shadow: 0 1px 6px rgba(0,0,0,0.7);
        }
        .nav-card-desc {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.78);
            line-height: 1.5;
            text-shadow: 0 1px 4px rgba(0,0,0,0.6);
        }
        .nav-card-arrow {
            margin-top: 16px;
            color: #ff9800;
            font-size: 1.1rem;
            align-self: flex-end;
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
        }
    </style>
</head>
