<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>待添加作品</title>
    <link rel="stylesheet" href="assets/css/work-common.css">
    <link rel="stylesheet" href="assets/css/gallery-common.css">
    <link rel="stylesheet" href="assets/css/lightbox-common.css">
    <style>
        .gallery-item img { cursor: zoom-in; }
        h1, h3 { color: #fff; }
        h1:first-of-type {
            margin-top: 0;
        }
        @media (max-width: 768px) {
            .gallery {
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            }
        }
        @media (max-width: 480px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body data-lightbox-selector="#gallery-main img" data-lightbox-clear="true">
    <div class="top-spacer"></div>
    <div id="sticky-title" class="sticky-title">
        <span class="sticky-title-text">待添加作品</span>
        <a class="sticky-back" href="index.html">返回简历</a>
    </div>

    <h1 class="slide-animate">待添加作品</h1>
    <p class="slide-animate">
        以下为 [作品描述]，[所用软件]，整体历时 [X] 天。
    </p>

    <!-- ========== B站视频（替换 BV号）========== -->
    <div class="video-top slide-animate">
        <iframe src="//player.bilibili.com/player.html?isOutside=true&bvid=BV号替换&p=1&autoplay=0&muted=0&danmaku=0" scrolling="no" frameborder="no" allowfullscreen="true"></iframe>
    </div>

    <h3 class="slide-animate">作品展示</h3>
    <div class="gallery slide-animate" id="gallery-main">
        <!-- 图片由下方 JS 动态加载 -->
    </div>

    <div id="fullscreen-overlay" style="display: none;" class="overlay">
        <img id="fullscreen-image" src="" alt="全屏展示">
    </div>

    <script>
        // ========== 修改这里 ==========
        const gallery = document.getElementById('gallery-main');
        const imagePath = 'works/[你的图片文件夹名]/';   // 图片存放路径
        const total = 0;                                    // 图片总数
        const filePrefix = '';                              // 文件名前缀（如 XS、IMG 等）
        const fileExt = '.webp';                            // 图片格式

        for (let i = 1; i <= total; i++) {
            const fn = `${filePrefix}${String(i).padStart(4, '0')}${fileExt}`;
            const item = document.createElement('div');
            item.className = 'gallery-item slide-animate';

            const img = document.createElement('img');
            img.src = `${imagePath}thumbs/640/${fn}`;
            img.srcset = `${imagePath}thumbs/320/${fn} 320w, ${imagePath}thumbs/640/${fn} 640w, ${imagePath}thumbs/1280/${fn} 1280w`;
            img.sizes = '(max-width: 480px) 100vw, (max-width: 768px) 50vw, 33vw';
            img.loading = 'lazy';
            img.dataset.fullsrc = `${imagePath}${fn}`;
            img.alt = `作品 ${i}`;

            item.appendChild(img);
            gallery.appendChild(item);
        }

    </script>

    <script src="assets/js/image-lightbox.js"></script>
    <script src="assets/js/sticky-title.js"></script>
    <script src="assets/js/scroll-animate.js"></script>
    <script src="assets/js/focus-work.js"></script>
</body>
</html>
